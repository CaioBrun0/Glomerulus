services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glomerulus_frontend
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/pathospotterlabeller/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
